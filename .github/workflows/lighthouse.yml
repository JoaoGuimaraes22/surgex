name: Lighthouse CI

# Scores the live www.surgex.pt, not the pushed commit (Vercel deploys after the push), so a run per push
# measured the previous deploy and spent ~11 min each: 22 runs on 2026-10-31 (portfolio cards from prospect
# runs). Weekly + on demand keeps the trend inside the 2,000 free Actions minutes (2026-11-04).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://www.surgex.pt
            https://www.surgex.pt/en
            https://www.surgex.pt/pt
          configPath: ./lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true
